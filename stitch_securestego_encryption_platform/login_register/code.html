<!DOCTYPE html>

                        "on-primary-fixed-variant": "#005048",
                        "surface-container-highest": "#2f353e",
                        "surface": "#0e141c",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#004395",
                        "outline-variant": "#3c4947",
                        "secondary-fixed": "#d8e2ff",
                        "on-primary-container": "#00423b",
                        "on-tertiary": "#5e1800",

                        "on-surface": "#dde3ee",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom soft shadow for elevated cards per style guide */
        .shadow-elevated {
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md font-body-md antialiased relative overflow-hidden">
<!-- Subtle background noise/texture effect for technical feel -->
<div class="absolute inset-0 pointer-events-none opacity-5" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<main class="w-full max-w-[440px] relative z-10">
<!-- Authentication Card -->
<div class="bg-surface-container border border-outline-variant rounded-lg p-lg shadow-elevated transition-all duration-300 relative overflow-hidden">
<!-- Subtle top accent line -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-surface-container via-primary-container to-surface-container opacity-80"></div>
<!-- Header -->
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-16 h-16 mb-md rounded-full bg-surface-container-lowest border border-outline-variant flex items-center justify-center shadow-inner">
<img alt="SecureStego Logo" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBv1YCkc_TUOBFbk-6aam9P3ukmxcaiptv91UxkZuB3L8u7qUs0YN8u8-_vQbmq9CN3sBgoVRTnJbOYouDd6iIcqOUco9fci_PEDN1sJaovPsSULj5jqf5u_llIiPrjJ4HSLEzi5pjaVbZP-lrb1Yfb7ptJsdt-K-MGQPTKlj7Ff-t5whhtbIpui21t3DxfNgHPsOxB10k4RDTGWlf5WcQf7q6xywHW9GsWwny2981nPKKNcRCOmk9lxg"/>
</div>
<h1 class="font-headline-md text-3xl font-semibold text-on-surface tracking-tight mb-xs">System Access</h1>
<p class="font-body-sm text-on-surface-variant">Provide credentials to initialize secure session.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-code text-label-code text-on-surface-variant mb-xs flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[16px]">mail</span>
                        USER_ID // EMAIL
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm text-on-surface font-label-code text-[14px] placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 transition-all duration-200" id="email" name="email" placeholder="operator@securestego.net" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-code text-label-code text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[16px]">key</span>
                            AUTH_KEY // PASSWORD
                        </label>
<a class="font-label-code text-[11px] text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Key?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm text-on-surface font-label-code text-[14px] placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 transition-all duration-200" id="password" name="password" placeholder="••••••••••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Area -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary-container rounded-lg py-sm px-gutter font-headline-sm text-[16px] font-semibold hover:bg-[#119d8e] transition-colors flex items-center justify-center gap-2 group border border-transparent hover:border-primary/30" type="submit">
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">login</span>
                        Initialize Session
                    </button>
</div>
</form>
<!-- Footer Toggle -->
<div class="mt-lg text-center pt-md border-t border-outline-variant/50">
<p class="font-body-sm text-on-surface-variant">
                    Unregistered operative? 
                    <a class="text-primary font-medium hover:text-primary-fixed hover:underline decoration-primary/50 transition-all ml-1" href="#">Request Access clearance</a>
</p>
</div>
</div>
<!-- System Status Indicator -->
<div class="mt-md text-center flex items-center justify-center gap-2 font-label-code text-[10px] text-on-surface-variant/60 uppercase tracking-widest">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
            System Online. Connection Secure.
        </div>
</main>
</body></html>
